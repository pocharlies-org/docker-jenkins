name: image-guard-test

# PR de prueba desechable (INFRA-1298, criterio C4): caso (c), PR limpia:
# Dockerfile sin avisos de hadolint e imagen exactamente en la linea base
# (dentro del umbral del 20%%) -> el check debe PASAR.
# Se cierra sin fusionar tras enlazar la ejecucion en la PR de gitops.
on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-image-guard.yml@c9992b8a955ba34399e50c072eeda211a66c86ed
    with:
      dockerfile: Dockerfile
      imagen: alpine@sha256:9db2934886712d877c932e07249c75a59e6ca27adfbccc05261987a17bef2d63
      baseline: sizes-baseline.json
      modo: bloquear
      crecimiento: 20
      framework_sha: c9992b8a955ba34399e50c072eeda211a66c86ed
